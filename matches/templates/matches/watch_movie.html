<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ match.title }} - StreamPulse</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .player-wrapper {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            aspect-ratio: 16 / 9;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .movie-details {
            margin-top: 25px;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .btn-success {
            padding: 12px 25px;
            background-color: #28a745;
            color: white;
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .navbar {
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #1ed760;
            text-decoration: none;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">STREAMPULSE</a>
</nav>

<div class="container">
    <div class="movie-details">
        <h2 style="color: #fff;">{{ match.title }}</h2>
    </div>

    <div class="player-wrapper">
        <iframe src="{{ match.server2_url }}" width="100%" height="500px" frameborder="0" allowfullscreen="true" scrolling="NO"></iframe>
    </div>

    <div class="download-section">
        <a href="{{ match.download_url }}" class="btn btn-success" target="_blank">📥 Download Movie</a>
    </div>
</div>

</body>
</html>
